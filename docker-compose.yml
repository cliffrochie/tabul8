services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabul8-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - tabul8_db:/var/lib/tabul8
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/tabul8/database.sqlite

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabul8-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - tabul8_db:/var/lib/tabul8
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/tabul8/database.sqlite

  frontend:
    image: node:22-alpine
    container_name: tabul8-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  tabul8_db:
