services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabul8-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - tabul8_db:/var/lib/tabul8
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-tabul8-venue}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-tabul8-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-tabul8-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/tabul8/database.sqlite
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabul8-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - tabul8_db:/var/lib/tabul8
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-tabul8-venue}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-tabul8-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-tabul8-local-secret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/tabul8/database.sqlite
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: node:22-alpine
    container_name: tabul8-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: tabul8-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/tabul8.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  tabul8_db:
